<!doctype html>
<!--
  OG image template (PLAN.md 9). Owned by B. scripts/og.mjs screenshots this
  page at 1200 by 630 and writes public/og.png. Lives outside public/ so it is
  never deployed as a page. Uses the real tokens and fonts.

  The map is the site's own poster, not a copy of it: on load og.js reads
  the built dist/index.html, takes the prerendered map (the svg with
  role="img") and the site stylesheet, and sets them on the right. So run
  `npm run build` before `npm run og`. Without a build (or before the map
  exists) it falls back to the ping itself: concentric sodium rings leaving
  one lit node. body[data-ready] is set when either is in place.

  Content: the name, "software engineer · plano, texas", ayroescobar.com,
  the lit grid. No numbers, no age.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>og</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <style id="og-style">
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--night);
      }
      body {
        position: relative;
        font-family: 'Overpass Dot', 'Overpass Variable', 'Overpass Fallback', sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: 'Overpass Mono Variable', 'Overpass Mono Fallback', monospace;
        letter-spacing: 0.04em;
      }
      .horizon {
        position: absolute;
        inset: 0 0 auto 0;
        height: 180px;
        background: linear-gradient(to bottom, color-mix(in oklab, var(--led) 6%, transparent), transparent);
      }

      /* The map: the hero's own NightGrid layer, full bleed under the type. */
      .map {
        position: absolute;
        inset: 0;
      }
      .map .ng {
        position: absolute;
        inset: 0;
        height: 630px;
      }
      /* A soft night falloff so the name always reads over the roads. */
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, var(--night) 0, var(--night) 34%, color-mix(in oklab, var(--night) 60%, transparent) 46%, transparent 60%);
      }

      /* Fallback: the ping, leaving Plano. */
      .rings {
        position: absolute;
        left: 880px;
        top: 330px;
      }
      .rings span {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        border: 2px solid var(--sodium);
        transform: translate(-50%, -50%);
      }
      .rings .core {
        width: 22px;
        height: 22px;
        border: 0;
        background: var(--sodium);
      }
      .rings .glow {
        width: 220px;
        height: 220px;
        border: 0;
        background: radial-gradient(closest-side, color-mix(in oklab, var(--sodium) 45%, transparent), transparent);
      }
      .rings .ring-label {
        width: auto;
        height: auto;
        border: 0;
        border-radius: 0;
        transform: translate(22px, 18px);
        color: var(--sodium);
        font-size: 22px;
      }
      body[data-map='grid'] .rings {
        display: none;
      }
      body:not([data-map='grid']) .shade {
        display: none;
      }

      /* The type. */
      .copy,
      .host,
      .rule {
        z-index: 1;
      }
      .copy {
        position: absolute;
        left: 88px;
        top: 112px;
      }
      .eyebrow {
        margin: 0 0 26px;
        font-size: 26px;
        color: var(--dim);
      }
      h1 {
        margin: 0;
        font-size: 148px;
        line-height: 0.86;
        font-weight: 900;
        letter-spacing: -0.035em;
      }
      h1 span {
        display: block;
      }
      .host {
        position: absolute;
        left: 88px;
        bottom: 66px;
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0;
        font-size: 26px;
        color: var(--sodium);
      }
      .host i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--sodium);
        box-shadow: none;
      }
      .rule {
        position: absolute;
        left: 88px;
        bottom: 122px;
        width: 64px;
        height: 3px;
        background: var(--sodium);
      }
    </style>
  </head>
  <body>
    <div class="horizon"></div>
    <div class="map" id="map"></div>
    <div class="shade"></div>
    <div class="rings" aria-hidden="true">
      <span class="glow"></span>
      <span style="width: 120px; height: 120px; opacity: 0.55"></span>
      <span style="width: 250px; height: 250px; opacity: 0.32"></span>
      <span style="width: 400px; height: 400px; opacity: 0.18"></span>
      <span style="width: 570px; height: 570px; opacity: 0.09"></span>
      <span class="core"></span>
      <span class="ring-label mono">plano</span>
    </div>
    <div class="copy">
      <p class="mono eyebrow">software engineer · plano, texas</p>
      <h1><span>Ayro</span><span>Escobar</span></h1>
    </div>
    <span class="rule"></span>
    <p class="mono host"><i></i>ayroescobar.com</p>

    <script type="module" src="/og/og.js"></script>
  </body>
</html>
