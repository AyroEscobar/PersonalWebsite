<!doctype html>
<!--
  OG image template (DESIGN.md 6.10). scripts/og.mjs screenshots this page
  at 1200 by 630 and writes public/og.png. It lives outside public/ so it is
  never deployed as a page.

  It is the site's own first screen, recomposed for a card: og.js reads the
  built dist/index.html and borrows its stylesheet, the hero's light field
  (blobs and the 5 percent grid), the masthead and the prerendered sentence
  with its lens. Then it runs src/glass/lens.js, so in Chrome the lens
  really magnifies line 2. Run `npm run build` before `npm run og`.
  body[data-ready] is set once the sentence, the fonts and the lens are in.

  Content: his name and role (from the masthead), the whole-map sentence,
  ayroescobar.com. No numbers, no age.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>og</title>
    <link rel="icon" href="data:," />
    <style id="og-style">
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--base, #FBF9F4);
      }
      /* the borrowed field fills the card; its grid fades over the last 160px */
      .og .field {
        inset: 0;
      }
      .og-copy {
        position: absolute;
        inset: 0;
        z-index: 1;
        padding: 56px 72px 0;
      }
      .og .masthead .quiet,
      .og .masthead .tip-wrap {
        display: none;
      }
      .og .mh-name {
        font-size: 30px;
      }
      .og .mh-role {
        font-size: 18px;
      }
      .og .sentence {
        margin-top: 58px;
        margin-left: 8px;
        font-size: 66px;
      }
      .og-host {
        position: absolute;
        left: 72px;
        bottom: 52px;
        margin: 0;
        font: 500 20px / 1 var(--sans, sans-serif);
        color: var(--ink-2, #4A443C);
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div id="field"></div>
      <div class="og-copy" id="copy">
        <p class="og-host">ayroescobar.com</p>
      </div>
    </div>
    <script type="module" src="/og/og.js"></script>
  </body>
</html>
